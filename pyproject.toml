[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vv-knopka"
version = "0.1.0"
description = "Review-first AI-assisted YouTube Shorts pilot"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "yt-dlp>=2026.1,<2027",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
vv = "vv_knopka.cli:main"
vv-cat-trends = "vv_knopka.trend_discovery:main"
vv-cat-community = "vv_knopka.reddit_trend_discovery:main"
vv-cat-theme = "vv_knopka.cat_theme:main"
vv-cat-import = "vv_knopka.trend_import:main"
vv-cat-youtube = "vv_knopka.youtube_cat_source_v2:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
