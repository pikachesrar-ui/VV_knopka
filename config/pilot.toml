[pilot]
total_shorts = 15
openai_budget_usd = 10.0
auto_publish = false
review_required = true
runtime_dir = "runtime"

[content]
niche = "animals_nature_curiosities"
channel_strategy = "single_channel_pilot"
default_language = "en"
russian_slots = [1, 2]
ai_slots = [1, 3, 5, 7, 9, 11, 13, 15]
animal_slots = [2, 4, 6, 8, 10, 12, 14]

[openai]
writer_model = "gpt-5.6-terra"
writer_reasoning_effort = "low"
terra_input_per_million_usd = 2.0
terra_output_per_million_usd = 12.0
luna_input_per_million_usd = 0.20
luna_output_per_million_usd = 1.20
max_estimated_cost_per_call_usd = 0.25

[video]
aspect = "9:16"
target_min_seconds = 25
target_max_seconds = 45
clip_seconds = 6
subtitle_enabled = true
bgm_volume = 0.08
visual_transition = "none"
subtitle_font_name = "VVKnopka-Cyrillic.ttf"
subtitle_font_name_en = "BeVietnamPro-Bold.ttf"
subtitle_font_size = 52
subtitle_position = "custom"
subtitle_custom_position = 74.0
subtitle_color = "#FFFFFF"
subtitle_stroke_color = "#000000"
subtitle_stroke_width = 2.2

[animal]
# Cat format: local FFmpeg renderer. MoneyPrinterTurbo is not used for this pipeline.
clip_seconds = 5
material_count = 6
min_unique_materials = 5
# Frozen pilot keeps slot 2 RU and the remaining six cat slots EN. Long-run production uses this exact 80/20 cycle.
language_cycle = ["en", "en", "en", "en", "ru"]
# Short opening, more visible inter-clip card, and a dedicated closing card.
intro_card_seconds = 0.9
transition_card_seconds = 0.75
end_card_seconds = 1.0
# Windows pilot: Impact is bold/condensed and Microsoft documents Cyrillic support.
# On non-Windows CI this path is absent and renderer falls back to the local system font.
card_font_file = 'C:\Windows\Fonts\impact.ttf'
title_font_size = 84
transition_font_size = 78
end_font_size = 82
card_wrap_chars = 18
# Cat clips must carry actual source audio; a technically present but effectively silent track is rejected.
require_source_audio = true
min_source_mean_volume_db = -55.0
source_audio_volume = 1.0
# Cat source footage must already be vertical and close to 9:16. Width/height ratio
# may differ by at most 0.08 from 9/16; landscape and visibly-wide portrait clips fail closed.
source_aspect_tolerance = 0.08
# Search deeper because stock libraries often publish silent footage.
audio_pexels_candidates = 60
audio_pixabay_candidates = 80
# Put one chosen real meow here and it will be reused on every intro/transition/end card.
# CAT_MEOW_FILE in .env can override this path.
meow_file = "runtime/assets/cat-transition-meow.mp3"
meow_volume = 0.90
transition_sfx = "soft_meow"

[materials]
ai_material_count = 8
min_unique_ai_materials = 3
min_reusable_stock_seconds = 36
max_segments_per_source = 4
pexels_per_page = 40
pixabay_per_page = 100
vision_model = "gpt-5.6-luna"
vision_batch_size = 10
vision_max_candidates = 30
pixabay_vision_max_candidates = 40
vision_min_confidence = 0.72
vision_max_estimated_cost_per_call_usd = 0.03
highlight_vision_max_estimated_cost_usd = 0.05

[audio]
# Global transition SFX remain disabled. Animal-only meow is scoped under [animal].
transition_sfx = "none"
forbidden_transition_tags = ["bass", "bass_drop", "impact", "boom", "sub_drop"]
compilation_lufs = -16.0
true_peak_db = -1.5
# These remain for MoneyPrinterTurbo AI shorts; the cat renderer has no voiceover.
edge_voice_en = "en-US-AriaNeural"
edge_voice_ru = "ru-RU-SvetlanaNeural"

[safety]
require_source_provenance = true
require_commercial_use_flag = true
require_human_review = true
block_duplicate_sha256 = true
max_script_similarity = 0.92
