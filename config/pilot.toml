[pilot]
total_shorts = 15
openai_budget_usd = 10.0
auto_publish = false
review_required = true
runtime_dir = "runtime"

[content]
niche = "animals_nature_curiosities"
channel_strategy = "single_channel_pilot"
default_language = "en"
russian_slots = [1, 2]
ai_slots = [1, 3, 5, 7, 9, 11, 13, 15]
animal_slots = [2, 4, 6, 8, 10, 12, 14]

[openai]
writer_model = "gpt-5.6-terra"
writer_reasoning_effort = "low"
terra_input_per_million_usd = 2.0
terra_output_per_million_usd = 12.0
luna_input_per_million_usd = 0.20
luna_output_per_million_usd = 1.20
max_estimated_cost_per_call_usd = 0.25

[video]
aspect = "9:16"
target_min_seconds = 25
target_max_seconds = 45
clip_seconds = 6
subtitle_enabled = true
bgm_volume = 0.08
# MPT FadeIn fades every source from black rather than crossfading clips.
# Keep clean cuts until VV_knopka implements a true transition layer.
visual_transition = "none"
subtitle_font_name = "VVKnopka-Cyrillic.ttf"
subtitle_font_name_en = "BeVietnamPro-Bold.ttf"
subtitle_font_size = 52
subtitle_position = "custom"
subtitle_custom_position = 74.0
subtitle_color = "#FFFFFF"
subtitle_stroke_color = "#000000"
subtitle_stroke_width = 2.2

[animal]
# First cat compilation target: six distinct licensed sources x ~5 sec = ~30 sec.
clip_seconds = 5
material_count = 6
min_unique_materials = 5

[materials]
ai_material_count = 8
min_unique_ai_materials = 3
min_reusable_stock_seconds = 36
max_segments_per_source = 4
pexels_per_page = 40
pixabay_per_page = 100
vision_model = "gpt-5.6-luna"
vision_batch_size = 10
vision_max_candidates = 30
pixabay_vision_max_candidates = 40
vision_min_confidence = 0.72
vision_max_estimated_cost_per_call_usd = 0.03

[audio]
transition_sfx = "none"
forbidden_transition_tags = ["bass", "bass_drop", "impact", "boom", "sub_drop"]
compilation_lufs = -16.0
true_peak_db = -1.5
edge_voice_en = "en-US-AriaNeural-Female"
edge_voice_ru = "ru-RU-SvetlanaNeural-Female"

[safety]
require_source_provenance = true
require_commercial_use_flag = true
require_human_review = true
block_duplicate_sha256 = true
max_script_similarity = 0.92
